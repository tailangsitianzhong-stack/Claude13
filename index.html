<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Block Fighter - Stage</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87c5ff; overscroll-behavior: none; }
      /* スマホ: 長押しでの文字選択・呼び出しメニュー・タップ時の色・拡大をすべて止める */
      html, body, body * {
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      /* ---- スタート画面とロード画面（JS の読み込みより先に出る）---- */
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 35%, #2f5fb0 0%, #14224a 60%, #070b1c 100%); color: #fff; font-family: system-ui, sans-serif;
        padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        transition: opacity 0.5s; touch-action: manipulation; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .blocks { position: absolute; inset: 0; pointer-events: none; }
      #boot .blocks i { position: absolute; display: block; width: var(--s); height: var(--s); left: var(--x); bottom: -20%; background: var(--c); opacity: 0.35; border-radius: 3px;
        animation: boot-rise var(--d) linear infinite; animation-delay: var(--w); }
      @keyframes boot-rise { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-130vh) rotate(180deg); } }
      #boot .logo { position: relative; text-align: center; font: 900 min(14vw, 78px)/0.95 system-ui, sans-serif; letter-spacing: 0.06em;
        text-shadow: 0 5px 0 #0a1f4d, 0 0 26px #4fd8ff; }
      #boot .logo span { display: block; }
      #boot .logo span:last-child { color: #ffd54a; text-shadow: 0 5px 0 #6a3a00, 0 0 26px #ff9800; }
      #boot .sub { position: relative; font-size: 12px; letter-spacing: 0.5em; color: #9fd4ff; margin-top: -4px; }
      #boot button { position: relative; margin-top: 8px; padding: 13px 54px; border: 0; border-radius: 999px; cursor: pointer; font: 900 20px/1 system-ui, sans-serif; letter-spacing: 0.45em; text-indent: 0.45em;
        color: #5a1a00; background: linear-gradient(#fff59d, #ff9800); box-shadow: 0 6px 0 #8a1c10, 0 0 22px 5px rgba(255,160,40,0.65); animation: boot-pulse 1.1s ease-in-out infinite alternate; }
      #boot button:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a1c10; }
      #boot button:disabled { filter: grayscale(0.6) brightness(0.8); animation: none; cursor: default; }
      @keyframes boot-pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
      #boot .load { position: relative; width: min(70vw, 420px); display: none; flex-direction: column; align-items: center; gap: 8px; }
      #boot.loading .load { display: flex; }
      #boot.loading button, #boot.loading .foot { display: none; }
      #boot .bar { width: 100%; height: 16px; border-radius: 9px; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.75); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4fd8ff, #7dff8a); transition: width 0.15s; }
      #boot .msg { font-size: 13px; letter-spacing: 0.15em; color: #cfe6ff; min-height: 1.4em; text-align: center; }
      #boot .pct { font: 800 15px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      #boot .ver { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(6px, env(safe-area-inset-bottom)); font-size: 10px; color: rgba(159, 196, 255, 0.7); letter-spacing: 0.05em; }
      #boot .foot { position: relative; font-size: 11px; letter-spacing: 0.12em; color: #7f9cd0; }
      canvas { display: block; }
      #hud.touch { display: none; }
      #combo-prompt {
        position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%) scale(0.8); z-index: 5;
        padding: 6px 16px; border-radius: 999px; background: #ffb300; color: #3a2400;
        font: 800 16px/1.4 system-ui, sans-serif; box-shadow: 0 3px 0 #a86a00; pointer-events: none;
        opacity: 0; transition: opacity 0.06s, transform 0.06s;
      }
      #combo-prompt.show { opacity: 1; transform: translateX(-50%) scale(1); }
      #ult-prompt {
        position: fixed; left: 50%; bottom: 30%; transform: translateX(-50%) scale(0.8); z-index: 5;
        padding: 7px 20px; border-radius: 999px; background: linear-gradient(#fff59d, #ff9800); color: #5a1a00;
        font: 900 17px/1.4 system-ui, sans-serif; box-shadow: 0 3px 0 #8a1c10, 0 0 18px 5px rgba(255,160,40,0.8); pointer-events: none;
        opacity: 0; transition: opacity 0.1s, transform 0.2s;
      }
      #ult-prompt.show { opacity: 1; transform: translateX(-50%) scale(1); }
      #ult-prompt.touch { display: none; }
      #hud.touch ~ #combo-prompt, #combo-prompt.touch { display: none; }
      #boot-error {
        position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; padding: 10px 12px;
        background: #b3261e; color: #fff; font: 13px/1.5 system-ui, sans-serif; border-radius: 8px;
      }
      #hud {
        position: fixed; left: 12px; bottom: 10px; color: #fff;
        font: 13px/1.5 system-ui, sans-serif; text-shadow: 0 1px 2px #0008;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-error" hidden></div>
    <div id="boot">
      <div class="blocks" aria-hidden="true"></div>
      <div class="logo"><span>BLOCK</span><span>FIGHTER</span></div>
      <div class="sub">ブロックファイター</div>
      <button id="start-btn" type="button" disabled>読み込み中…</button>
      <div class="load">
        <div class="msg" id="load-msg">じゅんび中…</div>
        <div class="bar"><i id="load-bar"></i></div>
        <div class="pct" id="load-pct">0%</div>
      </div>
      <div class="ver" id="ver"></div>
      <div class="foot">画面をタップして、スタート。ロードで、すべての技の準備をします</div>
    </div>
    <script>
      // 背景のブロック（飾り）
      (function () {
        var box = document.querySelector('#boot .blocks'), colors = ['#4fd8ff', '#ffd54a', '#ff6a6a', '#7dff8a', '#c58bff'];
        for (var i = 0; i < 18; i++) {
          var b = document.createElement('i'), s = 16 + Math.random() * 34;
          b.style.cssText = '--s:' + s + 'px;--x:' + (Math.random() * 96) + '%;--c:' + colors[i % colors.length] + ';--d:' + (7 + Math.random() * 9) + 's;--w:' + (-Math.random() * 14) + 's';
          box.appendChild(b);
        }
      })();
    </script>

    <script>
      // 起動に失敗したら理由を画面に出す（空色の画面のまま止まらないように）
      (function () {
        var box = document.getElementById('boot-error');
        function show(msg) {
          if (window.game) { if (window.game.reportError) return; box.hidden = false; box.textContent = '実行中のエラー: ' + msg + '  （タップで閉じる）'; box.style.pointerEvents = 'auto'; box.onclick = function () { box.hidden = true; }; return; }
          box.hidden = false; box.textContent = '読み込みに失敗しました: ' + msg;
        }
        addEventListener('error', function (e) { show(e.message || (e.target && (e.target.src || e.target.href)) || 'unknown'); }, true);
        addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
    <div id="combo-prompt">Space: 掴み上げ！</div>
    <div id="ult-prompt">T: 必殺技！</div>
    <div id="hud">WASD / 矢印: 移動　Shift: 走る　Space: ジャンプ（空中で攻撃 = 叩きつけ）　左クリック / J: 攻撃（押し続けで連続斬り）　T / G: 必殺技（ゲージが満タンのとき）　K / E: スキル1（剣投げ）→ 使用後はスキル3（長押しでため斬り）　L / Q: スキル2（地割れ）→ 使用後はスキル4（突進）　F: 立ち⇔構え　｜　右ドラッグ: 視点　ホイール: 距離</div>
    <!-- GitHub Pages などビルドなしの配信でも動くよう、three は同梱ファイルから読む（Vite 使用時は無視される） -->
    <script>
      // iOS Safari は viewport の指定だけでは拡大を止められないので、操作そのものを打ち消す
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart'].forEach(function (t) {
          document.addEventListener(t, stop, { passive: false });
        });
        // ダブルタップでの拡大: 短い間隔の2回目のタップを無効にする
        var last = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - last < 350) e.preventDefault();
          last = now;
        }, { passive: false });
        // 2本指でのピンチ拡大と、画面全体のスクロール
        document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
      })();
    </script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
