<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Block Fighter - Stage</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87c5ff; overscroll-behavior: none; }
      canvas { display: block; touch-action: none; }
      #hud.touch { display: none; }
      #boot-error {
        position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30; padding: 10px 12px;
        background: #b3261e; color: #fff; font: 13px/1.5 system-ui, sans-serif; border-radius: 8px;
      }
      #hud {
        position: fixed; left: 12px; top: 10px; color: #fff;
        font: 13px/1.5 system-ui, sans-serif; text-shadow: 0 1px 2px #0008;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-error" hidden></div>
    <script>
      // 起動に失敗したら理由を画面に出す（空色の画面のまま止まらないように）
      (function () {
        var box = document.getElementById('boot-error');
        function show(msg) { if (window.game) return; box.hidden = false; box.textContent = '読み込みに失敗しました: ' + msg; }
        addEventListener('error', function (e) { show(e.message || (e.target && (e.target.src || e.target.href)) || 'unknown'); }, true);
        addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
    <div id="hud">WASD / 矢印: 移動　Shift: 走る　Space: ジャンプ　左クリック / J: 攻撃（押し続けで連続斬り）　F: 立ち⇔構え　｜　右ドラッグ: 視点　ホイール: 距離</div>
    <!-- GitHub Pages などビルドなしの配信でも動くよう、three は同梱ファイルから読む（Vite 使用時は無視される） -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
